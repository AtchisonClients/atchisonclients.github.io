
                                                        <!DOCTYPE html>
                                                        <html lang="en">
                                                        <head>
                                                            <meta charset="UTF-8">
                                                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                            <title>Performance Table</title>
                                                            <style>
                                                                /* Add CSS style for table */
                                                                table.dataframe {
                                                                    border-collapse: collapse;
                                                                    width: 100%;
                                                                    max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                    border-radius: 10px; /* Adjust the border radius as needed */
                                                                    overflow: hidden; /* Ensure the border-radius is applied */
                                                                }

                                                                table.dataframe th,
                                                                table.dataframe td {
                                                                    border: none;
                                                                    padding: 8px; /* Adjust padding as needed */
                                                                    text-align: center; /* Adjust text alignment as needed */
                                                                }

                                                                table.dataframe th {
                                                                    background-color: #3D555E; /* Optional: Add background color for header */
                                                                    color: #E7EAEB;
                                                                }

                                                                /* Add CSS rule for hover effect */
                                                                tr:hover {
                                                                    background-color: #1DC8F2;
                                                                }
                                                            </style>
                                                        </head>
                                                        <body>
                                                            <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>RAJOMON90</th>
      <td>4.60</td>
      <td>2.84</td>
      <td>10.20</td>
      <td>15.50</td>
    </tr>
    <tr>
      <th>Peer Group</th>
      <td>4.99</td>
      <td>3.95</td>
      <td>10.28</td>
      <td>12.33</td>
    </tr>
    <tr>
      <th>Inflation</th>
      <td>1.35</td>
      <td>1.45</td>
      <td>2.10</td>
      <td>2.38</td>
    </tr>
    <tr>
      <th>Outperformance vs Peers</th>
      <td>-0.38</td>
      <td>-1.11</td>
      <td>-0.07</td>
      <td>3.17</td>
    </tr>
    <tr>
      <th>Outperformance vs Inflation</th>
      <td>3.26</td>
      <td>1.39</td>
      <td>8.10</td>
      <td>13.12</td>
    </tr>
  </tbody>
</table>
                                                        </body>
                                                        </html>
