
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>8.85</td>
      <td>5.98</td>
      <td>12.65</td>
      <td>13.83</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>4.08</td>
      <td>1.21</td>
      <td>9.91</td>
      <td>17.20</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>7.58</td>
      <td>4.50</td>
      <td>9.31</td>
      <td>16.65</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>1.64</td>
      <td>-2.57</td>
      <td>5.63</td>
      <td>20.56</td>
    </tr>
    <tr>
      <th>Long Duration</th>
      <td>1.50</td>
      <td>2.34</td>
      <td>4.60</td>
      <td>4.25</td>
    </tr>
    <tr>
      <th>Floating Rate</th>
      <td>-1.55</td>
      <td>-0.86</td>
      <td>0.64</td>
      <td>3.03</td>
    </tr>
    <tr>
      <th>Cash</th>
      <td>1.04</td>
      <td>2.16</td>
      <td>4.68</td>
      <td>4.47</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
