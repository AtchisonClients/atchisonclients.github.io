
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>8.23</td>
      <td>3.44</td>
      <td>10.78</td>
      <td>14.49</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>9.18</td>
      <td>-0.26</td>
      <td>10.50</td>
      <td>18.07</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>7.17</td>
      <td>2.71</td>
      <td>3.16</td>
      <td>16.31</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>8.35</td>
      <td>-2.58</td>
      <td>4.56</td>
      <td>22.17</td>
    </tr>
    <tr>
      <th>Long Duration</th>
      <td>0.18</td>

      <td>3.94</td>
    </tr>
    <tr>

    <tr>

      <td>4.52</td>
      <td>4.40</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
