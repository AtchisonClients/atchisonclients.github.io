
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>7.11</td>
      <td>11.63</td>
      <td>14.13</td>
      <td>15.94</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>6.61</td>
      <td>2.97</td>
      <td>12.11</td>
      <td>16.97</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>5.37</td>
      <td>7.04</td>
      <td>4.70</td>
      <td>17.08</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>4.49</td>
      <td>6.77</td>
      <td>22.91</td>
      <td>29.49</td>
    </tr>
    <tr>
      <th>Long Duration</th>
      <td>0.87</td>
      <td>1.41</td>
      <td>2.01</td>
      <td>3.95</td>
    </tr>
    <tr>
      <th>Floating Rate</th>
      <td>2.25</td>
      <td>-2.54</td>
      <td>5.13</td>
      <td>3.49</td>
    </tr>
    <tr>
      <th>Cash</th>
      <td>0.93</td>
      <td>2.03</td>
      <td>4.46</td>
      <td>4.40</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
