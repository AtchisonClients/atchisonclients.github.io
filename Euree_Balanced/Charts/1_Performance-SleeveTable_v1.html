
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>6.18</td>
      <td>5.20</td>
      <td>10.05</td>
      <td>12.01</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>8.55</td>
      <td>4.93</td>
      <td>13.92</td>
      <td>17.82</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>2.79</td>
      <td>5.83</td>
      <td>16.54</td>
      <td>15.39</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>0.89</td>
      <td>14.71</td>
      <td>29.97</td>
      <td>22.49</td>
    </tr>
    <tr>
      <th>Long Duration</th>
      <td>1.33</td>
      <td>2.00</td>
      <td>4.78</td>
      <td>4.77</td>
    </tr>
    <tr>
      <th>Floating Rate</th>
      <td>1.64</td>
      <td>3.07</td>
      <td>6.21</td>
      <td>5.66</td>
    </tr>
    <tr>
      <th>Cash</th>
      <td>1.02</td>
      <td>2.13</td>
      <td>4.52</td>
      <td>4.52</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
