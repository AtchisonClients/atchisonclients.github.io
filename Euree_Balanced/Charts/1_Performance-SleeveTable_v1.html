
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>-3.26</td>
      <td>1.31</td>
      <td>6.50</td>
      <td>10.31</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>-7.48</td>
      <td>0.79</td>
      <td>8.86</td>
      <td>12.99</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>4.17</td>
      <td>6.18</td>
      <td>16.47</td>
      <td>16.25</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>10.12</td>
      <td>15.79</td>
      <td>29.32</td>
      <td>22.40</td>
    </tr>
    <tr>
      <th>Long Duration</th>
      <td>1.49</td>

    </tr>
    <tr>

    <tr>

      <td>1.06</td>
      <td>2.22</td>
      <td>4.58</td>
      <td>4.57</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
