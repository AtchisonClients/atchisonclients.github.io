
                                                                <!DOCTYPE html>
                                                                <html lang="en">
                                                                <head>
                                                                    <meta charset="UTF-8">
                                                                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                                    <title>Performance Table</title>
                                                                    <style>
                                                                        /* Add CSS style for table */
                                                                        table.dataframe {
                                                                            border-collapse: collapse;
                                                                            width: 100%;
                                                                            max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                            border-radius: 10px; /* Adjust the border radius as needed */
                                                                            overflow: hidden; /* Ensure the border-radius is applied */
                                                                        }

                                                                        table.dataframe th,
                                                                        table.dataframe td {
                                                                            border: none;
                                                                            padding: 8px; /* Adjust padding as needed */
                                                                            text-align: center; /* Adjust text alignment as needed */
                                                                        }

                                                                        table.dataframe th {
                                                                            background-color: #3D555E; /* Optional: Add background color for header */
                                                                            color: #E7EAEB;
                                                                        }

                                                                        /* Add CSS rule for hover effect */
                                                                        tr:hover {
                                                                            background-color: #1DC8F2;
                                                                        }
                                                                    </style>
                                                                </head>
                                                                <body>
                                                                    <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>Since Inception (p.a.)</th>
    </tr>
    <tr>
      <th>Code</th>
      <th></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Australian Shares</th>
      <td>-3.21</td>
      <td>1.38</td>
      <td>6.81</td>
      <td>10.85</td>
    </tr>
    <tr>
      <th>International Shares</th>
      <td>-7.36</td>
      <td>0.96</td>
      <td>9.20</td>
      <td>13.34</td>
    </tr>
    <tr>
      <th>Real Assets</th>
      <td>4.19</td>
      <td>6.28</td>
      <td>16.10</td>
      <td>15.79</td>
    </tr>
    <tr>
      <th>Alternatives</th>
      <td>10.10</td>
      <td>15.69</td>
      <td>29.30</td>
      <td>23.23</td>
    </tr>
    <tr>

    <tr>

    <tr>

      <td>4.59</td>
      <td>4.57</td>
    </tr>
  </tbody>
</table>
                                                                </body>
                                                                </html>
