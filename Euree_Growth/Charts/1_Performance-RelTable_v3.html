
                                                        <!DOCTYPE html>
                                                        <html lang="en">
                                                        <head>
                                                            <meta charset="UTF-8">
                                                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                            <title>Performance Table</title>
                                                            <style>
                                                                /* Add CSS style for table */
                                                                table.dataframe {
                                                                    border-collapse: collapse;
                                                                    width: 100%;
                                                                    max-width: 950px; /* Restrict table width to a maximum of 950px */
                                                                    border-radius: 10px; /* Adjust the border radius as needed */
                                                                    overflow: hidden; /* Ensure the border-radius is applied */
                                                                }

                                                                table.dataframe th,
                                                                table.dataframe td {
                                                                    border: none;
                                                                    padding: 8px; /* Adjust padding as needed */
                                                                    text-align: center; /* Adjust text alignment as needed */
                                                                }

                                                                table.dataframe th {
                                                                    background-color: #3D555E; /* Optional: Add background color for header */
                                                                    color: #E7EAEB;
                                                                }

                                                                /* Add CSS rule for hover effect */
                                                                tr:hover {
                                                                    background-color: #1DC8F2;
                                                                }
                                                            </style>
                                                        </head>
                                                        <body>
                                                            <table border="1" class="dataframe">
  <thead>
    <tr style="text-align: justify;">
      <th></th>
      <th>3 Months</th>
      <th>6 Months</th>
      <th>1 Year</th>
      <th>2 Years (p.a.)</th>
      <th>Since Inception (p.a.)</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>Euree_Growth</th>
      <td>0.78</td>
      <td>4.45</td>
      <td>9.45</td>
      <td>12.96</td>
      <td>13.46</td>
    </tr>
    <tr>
      <th>Peer Group</th>
      <td>0.03</td>
      <td>3.48</td>
      <td>6.34</td>
      <td>9.57</td>
      <td>10.22</td>
    </tr>
    <tr>
      <th>Inflation</th>
      <td>1.51</td>
      <td>3.72</td>
      <td>7.59</td>
      <td>7.11</td>
      <td>7.54</td>
    </tr>
    <tr>
      <th>Outperformance vs Peers</th>
      <td>0.75</td>
      <td>0.97</td>
      <td>3.11</td>
      <td>3.39</td>
      <td>3.25</td>
    </tr>
    <tr>
      <th>Outperformance vs Inflation</th>
      <td>-0.73</td>
      <td>0.73</td>
      <td>1.85</td>
      <td>5.85</td>
      <td>5.93</td>
    </tr>
  </tbody>
</table>
                                                        </body>
                                                        </html>
